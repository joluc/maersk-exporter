apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "maersk-exporter.fullname" . }}
  labels:
    {{- include "maersk-exporter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "maersk-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "maersk-exporter.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "maersk-exporter.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
          - "-listen-address={{ .Values.config.listenAddress }}"
          - "-metrics-path={{ .Values.config.metricsPath }}"
          - "-vessel-name-filter={{ .Values.config.vesselNameFilter }}"
          - "-vessels-refresh-interval={{ .Values.config.vesselsRefreshInterval }}"
          - "-request-timeout={{ .Values.config.requestTimeout }}"
        env:
          - name: MAERSK_CONSUMER_KEY
            valueFrom:
              secretKeyRef:
                name: {{ include "maersk-exporter.secretName" . }}
                key: maersk-consumer-key
          - name: AISSTREAM_API_KEY
            valueFrom:
              secretKeyRef:
                name: {{ include "maersk-exporter.secretName" . }}
                key: aisstream-api-key
        ports:
          - name: http
            containerPort: 9878
            protocol: TCP
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 12 }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 12 }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
